[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finance-sum"
version = "0.1.0"
description = "私用財務自動化 CLI 工具"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "cryptography>=42.0",
    "playwright>=1.40",
    "notion-client>=2.2",
    "python-telegram-bot>=21.0",
    "python-dotenv>=1.0",
    "pytesseract>=0.3",
    "Pillow>=10.0",
    "ddddocr>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
financesum = "finance_sum.cli:cli"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
